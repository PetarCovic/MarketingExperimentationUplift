[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-experimentation-uplift"
version = "0.1.0"
description = "Randomized advertising experiment and uplift-model benchmark"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
uplift-benchmark = "marketing_uplift.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

